name: Deploy Week 05 Interactive Trace to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'weeks/week-05/interactive-trace/**'
      - 'weeks/week-05/evidence/**'
      - '.github/workflows/deploy-week-05-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare Pages source
        run: |
          mkdir -p _site/week-05
          cp -R weeks/week-05/interactive-trace _site/week-05/
          cp -R weeks/week-05/evidence _site/week-05/
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
